<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            font-size: 18px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .error {
            background: #fef3c7;
            color: #92400e;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>❤️ Heart Disease Prediction</h1>

    <p class="subtitle">
        Enter patient information to predict the possibility of heart disease
    </p>

    <div class="form-grid">

        <div class="field">
            <label>Age</label>
            <input type="number" id="age" value="52">
        </div>

        <div class="field">
            <label>Sex</label>
            <select id="sex">
                <option value="1">Male</option>
                <option value="0">Female</option>
            </select>
        </div>

        <div class="field">
            <label>Chest Pain Type (cp)</label>
            <select id="cp">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>

        <div class="field">
            <label>Resting Blood Pressure</label>
            <input type="number" id="trestbps" value="125">
        </div>

        <div class="field">
            <label>Cholesterol</label>
            <input type="number" id="chol" value="212">
        </div>

        <div class="field">
            <label>Fasting Blood Sugar (fbs)</label>
            <select id="fbs">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>
        </div>

        <div class="field">
            <label>Rest ECG</label>
            <select id="restecg">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>

        <div class="field">
            <label>Maximum Heart Rate</label>
            <input type="number" id="thalach" value="168">
        </div>

        <div class="field">
            <label>Exercise Induced Angina</label>
            <select id="exang">
                <option value="0">0</option>
                <option value="1">1</option>
            </select>
        </div>

        <div class="field">
            <label>Oldpeak</label>
            <input type="number" step="0.1" id="oldpeak" value="1.0">
        </div>

        <div class="field">
            <label>Slope</label>
            <select id="slope">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>

        <div class="field">
            <label>Number of Major Vessels (ca)</label>
            <select id="ca">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </div>

        <div class="field">
            <label>Thal</label>
            <select id="thal">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>

    </div>

    <button onclick="predictHeartDisease()">
        🔍 Predict Heart Disease
    </button>

    <div id="result"></div>

</div>


<script>

async function predictHeartDisease() {

    const result = document.getElementById("result");

    result.style.display = "block";
    result.className = "error";
    result.innerHTML = "⏳ Making prediction...";

    const patientData = {

        age: Number(document.getElementById("age").value),
        sex: Number(document.getElementById("sex").value),
        cp: Number(document.getElementById("cp").value),
        trestbps: Number(document.getElementById("trestbps").value),
        chol: Number(document.getElementById("chol").value),
        fbs: Number(document.getElementById("fbs").value),
        restecg: Number(document.getElementById("restecg").value),
        thalach: Number(document.getElementById("thalach").value),
        exang: Number(document.getElementById("exang").value),
        oldpeak: Number(document.getElementById("oldpeak").value),
        slope: Number(document.getElementById("slope").value),
        ca: Number(document.getElementById("ca").value),
        thal: Number(document.getElementById("thal").value)

    };

    try {

        const response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                data: patientData
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Prediction failed");
        }

        if (data.prediction === 1) {

            result.className = "danger";

            result.innerHTML = `
                ❤️ <strong>Heart Disease Detected</strong>
                <br><br>
                Confidence: ${data.confidence}%
            `;

        } else {

            result.className = "success";

            result.innerHTML = `
                ✅ <strong>No Heart Disease Detected</strong>
                <br><br>
                Confidence: ${data.confidence}%
            `;

        }

    } catch (error) {

        result.className = "error";

        result.innerHTML = `
            ❌ Error: ${error.message}
            <br><br>
            Make sure your FastAPI server is running.
        `;

    }

}

</script>

</body>
</html>
